<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Frontend Mentor Profile Card Component challenge">
    <meta name="author" content="Anees Ul Rehman">
    <link rel="shortcut icon" href="/assets/favicon-32x32.png" type="image/png">

    <link rel="stylesheet" href="style.css">
    <title>Profile card component - Frontend mentor challenge </title>
</head>

<body>
    <main>
        <!-- background  -->
        <div class="background">
            <img class="bg-pattern-top" src="assets/bg-pattern-top.svg" alt="bg-pattern">
            <img class="bg-pattern-bottom" src="assets/bg-pattern-bottom.svg" alt="bg-pattern">
        </div>
        <section class="profile-card">
            <!-- card background -->
             <div class="card-top-bg">
                <img src="assets/bg-pattern-card.svg" alt="">
             </div>
            <div class="img-name">
                <img src="assets/image-victor.jpg" alt="profile-image">
                <p class="name">Victor Crest <span class="age">26</span></p>
                <p class="secondary-text">London</p>
            </div>
            <hr>
            <div class="stats">
                <div class="stats-child">
                    80K <span class="secondary-text">Followers</span>
                </div>
                <div class="stats-child">
                    803K <span class="secondary-text">Likes</span>
                </div>
                <div class="stats-child">
                    1.4K <span class="secondary-text">Photos</span>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
